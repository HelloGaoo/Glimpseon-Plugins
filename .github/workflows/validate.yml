name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py
      - name: purge jsDelivr
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -s "https://purge.jsdelivr.net/gh/HelloGaoo/Glimpseon-Plugins@main/plugins.json" > /dev/null
